flutter_native_splash:
  color: "#F5F7F2"
  color_dark: "#F5F7F2"
  image: assets/branding/icon-black.png
  image_dark: assets/branding/icon-black.png
  info_plist_files:
    - ios/YABus/Info.plist

  android: true
  ios: true
  web: true

  android_12:
    color: "#F5F7F2"
    color_dark: "#F5F7F2"
    # Android masks this 1152px image to a 768px circle; use a padded icon.
    image: assets/branding/icon-black-android12.png
    image_dark: assets/branding/icon-black-android12.png
